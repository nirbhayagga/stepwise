# Single pipeline: build + type-check → Playwright (algorithm invariants and
# browser end-to-end) → Lighthouse, then on pushes to main / version tags
# publish the container image to GHCR and (optionally) GitHub Pages.
#
# Marketplace actions are kept to the minimum (checkout, setup-node, artifact
# upload, Pages deploy); Docker and Lighthouse run as plain shell steps.
#
# This repo is push-mirrored from Forgejo. The deploy jobs are gated on
# github.server_url so a Forgejo Actions runner picking up this file only runs
# the test job and never tries to log in to GHCR with a Forgejo token.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build · Playwright · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright — algorithm invariants + end-to-end
        run: npx playwright test

      - name: Lighthouse
        run: npx lhci autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    name: Deploy · GitHub Pages
    needs: test
    # Enable by setting repository variable DEPLOY_PAGES=true and
    # Settings → Pages → Source: "GitHub Actions".
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://github.com' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  image:
    name: Deploy · container image
    needs: test
    if: github.event_name == 'push' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS+=(-t "$IMAGE:${GITHUB_REF_NAME#v}")
          else
            TAGS+=(-t "$IMAGE:main" -t "$IMAGE:latest")
          fi
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${TAGS[@]}" .
          docker push --all-tags "$IMAGE"
